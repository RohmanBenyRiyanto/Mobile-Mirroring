// A trimmed copy of the parts of Android Studio's profiler transport protocol (Apache License 2.0, The Android Open Source
// Project: tools/base/transport/proto) that Benz Mirror uses. Field numbers are the originals, so it talks to Studio's daemon.
syntax = "proto3";
package profiler.proto;

service TransportService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse) {}
  rpc GetEvents(GetEventsRequest) returns (stream Event) {}
}

message ExecuteRequest { Command command = 1; }
message ExecuteResponse { int32 command_id = 1; }
message GetEventsRequest {}

message Command {
  enum CommandType {
    UNSPECIFIED = 0;
    ATTACH_AGENT = 10;
    BEGIN_SESSION = 101;
    END_SESSION = 102;
    APP_INSPECTION = 1200;
  }
  int64 stream_id = 1;
  CommandType type = 2;
  int32 pid = 3;
  int32 command_id = 4;
  int64 session_id = 5;
  bool should_end_session = 6;
  oneof union {
    BeginSession begin_session = 101;
    EndSession end_session = 102;
    AppInspectionCommand app_inspection_command = 1200;
  }
}

message BeginSession {
  message JvmtiConfig {
    bool attach_agent = 1;
    string agent_lib_file_name = 2;
    string agent_config_path = 3;
    string package_name = 4;
  }
  JvmtiConfig jvmti_config = 1;
  int64 request_time_epoch_ms = 2;
  string session_name = 3;
  string process_abi = 4;
}

message EndSession { int64 session_id = 1; }

message Event {
  enum Kind {
    NONE = 0;
    STREAM = 1;
    PROCESS = 2;
    AGENT = 3;
    APP_INSPECTION_EVENT = 1201;
    APP_INSPECTION_RESPONSE = 1202;
    APP_INSPECTION_PAYLOAD = 1203;
  }
  int32 pid = 1;
  int64 group_id = 2;
  Kind kind = 3;
  int64 timestamp = 4;
  bool is_ended = 5;
  int32 command_id = 6;
  oneof union {
    AgentData agent_data = 12;
    AppInspectionEvent app_inspection_event = 1201;
    AppInspectionResponse app_inspection_response = 1202;
    AppInspectionPayload app_inspection_payload = 1203;
  }
}

message AgentData {
  enum Status {
    UNSPECIFIED = 0;
    ATTACHED = 1;
    UNATTACHABLE = 2;
  }
  Status status = 1;
}

message AppInspectionCommand {
  string inspector_id = 1;
  uint32 command_id = 2;
  oneof union {
    CreateInspectorCommand create_inspector_command = 3;
    DisposeInspectorCommand dispose_inspector_command = 4;
    RawCommand raw_inspector_command = 5;
  }
}
message CreateInspectorCommand {
  string dex_path = 1;
  LaunchMetadata launch_metadata = 2;
}
message LaunchMetadata {
  string launched_by_name = 1;
  bool force = 2;
}
message DisposeInspectorCommand {}
message RawCommand { bytes content = 1; }

message AppInspectionPayload {
  bytes chunk = 1;
  uint32 chunk_count = 2;
  uint32 chunk_index = 3;
}
message AppInspectionResponse {
  uint32 command_id = 1;
  enum Status {
    SUCCESS = 0;
    ERROR = 1;
  }
  Status status = 2;
  string error_message = 3;
  oneof union {
    CreateInspectorResponse create_inspector_response = 4;
    RawResponse raw_response = 6;
  }
}
message CreateInspectorResponse {
  enum Status {
    SUCCESS = 0;
    GENERIC_SERVICE_ERROR = 1;
    VERSION_INCOMPATIBLE = 2;
    VERSION_MISSING = 3;
    LIBRARY_MISSING = 4;
    APP_PROGUARDED = 5;
  }
  Status status = 1;
}
message RawResponse {
  oneof data {
    bytes content = 1;
    int64 payload_id = 2;
  }
}
message AppInspectionEvent {
  string inspector_id = 1;
  oneof union {
    RawEvent raw_event = 2;
    DisposedEvent disposed_event = 3;
  }
}
message RawEvent {
  oneof data {
    bytes content = 1;
    int64 payload_id = 2;
  }
}
message DisposedEvent { string error_message = 1; }
