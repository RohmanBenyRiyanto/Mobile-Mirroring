name: Website

# Publishes the website/ folder to GitHub Pages, from the production branch only.
# Settings → Pages → Source must be "GitHub Actions", and the github-pages environment may deploy from release/production.
on:
  push:
    branches: [release/production]
    paths: ["website/**", "CHANGELOG.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/release/production'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v5
