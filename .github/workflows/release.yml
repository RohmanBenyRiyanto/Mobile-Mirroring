name: Release DMG

# Tag push (v0.1.0-beta.1, v0.1.0, ...): builds the ad-hoc signed DMG and publishes it; a tag with a dash is a pre-release.
# Manual run (Actions tab): builds the same DMG and keeps it as a build artifact only, with no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Tools
        run: brew install xcodegen
      - name: Project
        run: scripts/generate-project.sh
      - name: Tests
        run: scripts/test.sh
      - name: DMG
        run: scripts/make-dmg.sh
      - name: Keep the DMG
        uses: actions/upload-artifact@v4
        with:
          name: Benz-Mirror-dmg
          path: build.noindex/Benz-Mirror-*.dmg
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { p = (index($0, "[" v "]") > 0); next } p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Benz Mirror $version" > release-notes.md; fi
          cat release-notes.md
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build.noindex/Benz-Mirror-*.dmg
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
